[package]
name = "cogwheel-classifier"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[features]
# Training pulls in the corpus reader, the SGD loop and the evaluation metrics. It is not compiled
# into the server binary — inference is the only thing that ships.
training = []

[dependencies]
chrono.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[[bin]]
name = "cogwheel-train"
path = "src/bin/train.rs"
required-features = ["training"]
