[package]
name = "cogwheel-storage"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
cogwheel-policy = { path = "../cogwheel-policy" }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
base64.workspace = true
# Only OsRng is needed, to seed ed25519 key generation. Depending on `rand_core`
# directly rather than the full `rand` crate drops a dependency whose thread-local RNG
# this code never touches, and with it RUSTSEC-2026-0097.
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.4.2"
